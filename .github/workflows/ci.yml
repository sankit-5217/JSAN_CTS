name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk
          POSTGRES_DB: opsdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://opsdesk:opsdesk@localhost:5432/opsdesk?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      # fetch-depth: 0 (full history) is required by the gitleaks secret
      # scan step below — a shallow clone can't diff the pushed commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json's "packageManager" field — passing
      # `version:` here too causes pnpm/action-setup to fail with
      # ERR_PNPM_BAD_PM_VERSION ("multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      # Node 20 is deprecated on GitHub-hosted runners (forced onto Node 24
      # with a warning regardless of what's requested here) — pinned to 24
      # explicitly so this is an intentional, visible choice instead of a
      # silent runner-level substitution.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 1. Install dependencies with lockfile (spec §20.1)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Must run before lint/typecheck/build: `@prisma/client`'s types
      # (PrismaClient, model delegates like `prisma.site`) don't exist
      # until this generates them from schema.prisma.
      - name: Generate Prisma client
        run: pnpm --filter @cts-dc-opsdesk/api prisma:generate

      # 2. Lint and formatting check
      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # 3. TypeScript type check
      - name: Typecheck
        run: pnpm typecheck

      # 5. Database migration validation
      - name: Validate migrations against a fresh database
        run: pnpm --filter @cts-dc-opsdesk/api prisma:deploy

      # 4 + 6. Unit / integration tests for critical modules
      - name: Test
        run: pnpm test

      # 6b. HTTP end-to-end: boots the real AppModule + supertest against the
      # Postgres service, in an isolated `e2e` schema so it never collides with
      # the `public` schema the migration-validation step above deployed.
      - name: Deploy migrations into the e2e schema
        run: pnpm --filter @cts-dc-opsdesk/api prisma:deploy
        env:
          DATABASE_URL: postgresql://opsdesk:opsdesk@localhost:5432/opsdesk?schema=e2e

      - name: E2E tests
        run: pnpm --filter @cts-dc-opsdesk/api test:e2e

      # 7. Dependency scan (spec §20.1) — build-blocking. The high-severity
      # advisories that used to require `continue-on-error` here (multer,
      # js-yaml, vite, glob, picomatch, lodash, tmp) are pinned to patched
      # versions via root package.json's `pnpm.overrides` (transitive deps)
      # and a direct vite 5->6 bump (apps/web/package.json) — see that
      # commit for why each override stays within its current major version.
      - name: Dependency scan
        run: pnpm audit --audit-level=high

      # 7. Secret scan (spec §20.1) — scans the pushed commits / PR diff.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9. Build artifacts
      - name: Build
        run: pnpm build

      # 8. Container build + scan (spec §20.1) — one image per app, scanned
      # for HIGH/CRITICAL vulnerabilities. Runs after the plain build so a
      # broken app build fails fast before spending time on image builds.
      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t opsdesk-api:ci .

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsdesk-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build web image
        run: docker build -f infra/docker/web.Dockerfile -t opsdesk-web:ci .

      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsdesk-web:ci
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Build worker image
        run: docker build -f infra/docker/worker.Dockerfile -t opsdesk-worker:ci .

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opsdesk-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
