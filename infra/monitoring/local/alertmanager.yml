# Local Alertmanager: forwards every firing/resolved alert to the OpsDesk API,
# which normalizes it (integrations/prometheus) and dedupes on
# prom-<fingerprint>-<startsAt>.

route:
  receiver: opsdesk
  group_by: ["alertname", "site", "ci"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: opsdesk
    webhook_configs:
      - url: http://127.0.0.1:3000/api/v1/alerts/sources/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            # An OpsDesk machine API token (odk_...) for a user with an alert
            # ingest role. Gitignored — see README.md for how to issue one.
            credentials_file: secrets/opsdesk-api-token
