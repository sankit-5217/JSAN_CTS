version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: opsdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk
      POSTGRES_DB: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opsdesk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: opsdesk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: opsdesk
      MINIO_ROOT_PASSWORD: opsdesk-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local/dev identity provider only (spec §7) — production points
  # OIDC_ISSUER_URL at the enterprise IdP instead. Realm, client and dev users
  # (password: opsdesk-dev) are imported from infra/keycloak on first start.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: opsdesk-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/opsdesk-realm.json:/opt/keycloak/data/import/opsdesk-realm.json:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: opsdesk-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: opsdesk-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: opsdesk-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres-data:
  redis-data:
  minio-data:
